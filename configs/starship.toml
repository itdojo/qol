"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](violet_deep)\
$os\
$hostname\
[](fg:violet_deep bg:violet)\
$directory\
[](fg:violet bg:moss_deep)\
$git_branch\
$git_status\
[](fg:moss_deep bg:moss)\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
$conda\
[](fg:moss)\
$line_break\
$character"""

palette = 'grove'

[os]
disabled = false
style = "bg:violet_deep fg:text"

[os.symbols]
AIX = " "
AlmaLinux = " "
Alpaquita = " "
Alpine = " "
ALTLinux = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = " "
Artix = " "
Bluefin = " "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Elementary = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = " "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = " "
InstantOS = " "
Ios = "󰀷 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = " "
OpenCloudOS = " "
openEuler = " "
openSUSE = " "
OracleLinux = "󰺡 "
PikaOS = " "
Pop = " "
Raspbian = " "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
Redox = "󰀘 "
RockyLinux = " "
Solus = " "
SUSE = " "
Ubuntu = " "
Ultramarine = " "
Unknown = " "
Uos = " "
Void = " "
Windows = "󰍲 "
Zorin = " "

[hostname]
ssh_only = false
style = "bg:violet_deep fg:text"
format = '[ $hostname]($style)'
trim_at = "."

[directory]
style = "bg:violet fg:text"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:moss_deep"
format = '[[ $symbol $branch ](fg:text bg:moss_deep)]($style)'

[git_status]
style = "bg:moss_deep"
format = '[[($all_status$ahead_behind )](fg:text bg:moss_deep)]($style)'

[nodejs]
symbol = ""
style = "bg:moss"
format = '[[ $symbol( $version) ](fg:crust bg:moss)]($style)'

[bun]
symbol = ""
style = "bg:moss"
format = '[[ $symbol( $version) ](fg:crust bg:moss)]($style)'

[c]
symbol = " "
style = "bg:moss"
format = '[[ $symbol( $version) ](fg:crust bg:moss)]($style)'

[rust]
symbol = ""
style = "bg:moss"
format = '[[ $symbol( $version) ](fg:crust bg:moss)]($style)'

[golang]
symbol = ""
style = "bg:moss"
format = '[[ $symbol( $version) ](fg:crust bg:moss)]($style)'

[php]
symbol = ""
style = "bg:moss"
format = '[[ $symbol( $version) ](fg:crust bg:moss)]($style)'

[java]
symbol = " "
style = "bg:moss"
format = '[[ $symbol( $version) ](fg:crust bg:moss)]($style)'

[kotlin]
symbol = ""
style = "bg:moss"
format = '[[ $symbol( $version) ](fg:crust bg:moss)]($style)'

[haskell]
symbol = ""
style = "bg:moss"
format = '[[ $symbol( $version) ](fg:crust bg:moss)]($style)'

[python]
symbol = ""
style = "bg:moss"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:moss)]($style)'

[docker_context]
symbol = ""
style = "bg:jade"
format = '[[ $symbol( $context) ](fg:crust bg:jade)]($style)'

[conda]
symbol = "  "
style = "fg:crust bg:moss"
format = '[$symbol$environment ]($style)'
ignore_base = false

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:jade)'
error_symbol = '[❯](bold fg:danger)'
vimcmd_symbol = '[❮](bold fg:jade)'
vimcmd_replace_one_symbol = '[❮](bold fg:orchid)'
vimcmd_replace_symbol = '[❮](bold fg:orchid)'
vimcmd_visual_symbol = '[❮](bold fg:violet)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:lavender"
disabled = false
show_notifications = true
min_time_to_notify = 45000

